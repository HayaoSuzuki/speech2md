repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Patch context lines and whitespace are part of the upstream diff.
        exclude: ^vendor/whisper\.cpp-patches/
      - id: end-of-file-fixer
        exclude: ^vendor/whisper\.cpp-patches/
      - id: check-case-conflict
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      # Release automation uses Python even though the application is Rust.
      - id: check-ast
      - id: debug-statements

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all -- --check
        pass_filenames: false
        files: '(^|/)(.*\.rs|rustfmt\.toml)$'

      - id: cargo-fmt-fuzz
        name: cargo fmt (fuzz)
        language: system
        entry: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
        pass_filenames: false
        files: '^fuzz/(Cargo\.toml|.*\.rs)$'

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        pass_filenames: false
        files: '(^|/)(.*\.rs|Cargo\.toml|Cargo\.lock|clippy\.toml|rust-toolchain\.toml)$'

      - id: cargo-test
        name: cargo test
        language: system
        entry: cargo test --workspace --all-features --locked
        pass_filenames: false
        files: '(^|/)(.*\.rs|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$'
