[package]
name = "yasumaro-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pulldown-cmark = "0.13"
yasumaro-core = { path = "../crates/yasumaro-core" }
yasumaro-formats = { path = "../crates/yasumaro-formats" }
yasumaro-runtime = { path = "../crates/yasumaro-runtime" }
tempfile = "3"

[[bin]]
name = "decode_audio"
path = "fuzz_targets/decode_audio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_commonmark"
path = "fuzz_targets/render_commonmark.rs"
test = false
doc = false
bench = false

[[bin]]
name = "whisper_json"
path = "fuzz_targets/whisper_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "assign_speakers"
path = "fuzz_targets/assign_speakers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
