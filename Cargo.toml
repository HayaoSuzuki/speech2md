[workspace]
members = [
  "crates/speech2md-core",
  "crates/speech2md-formats",
  "crates/speech2md-runtime",
  "crates/speech2md-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
