[package]
name = "speech2md-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = ["dep:ctrlc"]

[lints]
workspace = true

[dependencies]
tracing.workspace = true
bytemuck = "1"
ctrlc = { version = "3", optional = true }
directories = "6"
flate2 = "1"
fs4 = "0.13"
hound = "3"
memmap2 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rubato = "0.16"
send_ctrlc = "0.6.0"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }
speech2md-core = { path = "../speech2md-core" }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
tempfile = "3"
thiserror.workspace = true
tar = "0.4"
url = { version = "=2.5.0", features = ["serde"] }
wait-timeout = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "fake_whisper"
path = "src/bin/fake_whisper.rs"
required-features = ["test-support"]

[dev-dependencies]
tracing-subscriber.workspace = true
proptest = "1"
