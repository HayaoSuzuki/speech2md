[package]
name = "speech2md-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
speech2md-runtime = { path = "../speech2md-runtime" }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "speech2md"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
url = { version = "=2.4.1" }
