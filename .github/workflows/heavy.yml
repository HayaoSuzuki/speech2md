name: heavy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-whisper-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build patched whisper.cpp
        run: ./scripts/build-whisper-engine.sh dist
      - name: Verify archive contract
        run: ./scripts/verify-whisper-engine.sh dist/speech2md-whispercpp-v1.9.4-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: speech2md-whispercpp-v1.9.4-linux-x86_64
          path: dist/speech2md-whispercpp-v1.9.4-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
