name: Fuzzing

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing seconds per target
        type: choice
        options: ['30', '60', '300']
        default: '60'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore discovered corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ runner.os }}-${{ github.ref_name }}-
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz harness formatting
        run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml --check
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Seed and fuzz all targets
        run: python scripts/fuzz.py --seconds "${{ inputs.seconds || '60' }}"
      - name: Save discovered corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve reproducing inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
